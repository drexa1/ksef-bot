name = "ksefbot-whatsapp"
main = "worker-whatsapp/worker.ts"
compatibility_date = "2026-01-01"

[vars]
ENVIRONMENT = "cloudflare"
# Whatsapp
WHATSAPP_PHONE_NUMBER_ID = "YOUR_PHONE_NUMBER_ID"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "D1"
database_name = "ksef-bot"
database_id = "101428e1-3e1c-479b-a71b-374c1ee24412"
remote = true