name: Build CLI

on:
  push:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: ksef-bot

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            extension: ""
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            extension: ""
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: ".exe"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}${{ matrix.extension }}" "dist/${BINARY_NAME}${{ matrix.extension }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: dist/${{ env.BINARY_NAME }}${{ matrix.extension }}