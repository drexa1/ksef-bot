name: Build CLI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'db/**'
      - 'pages/**'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'worker/**'
      - 'BACKLOG.md'
      - 'FEATURES.md'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'tsconfig.json'
      - 'vite.config.js'
      - 'wrangler.worker.toml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
