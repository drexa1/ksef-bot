name: Deploy Cloudflare worker

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ENVIRONMENT: dev
  TEST_MODE: true
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Create CI .dev.vars
        run: |
          echo "ENVIRONMENT=dev"     > .dev.vars
          echo "API_KEY=${API_KEY}" >> .dev.vars
          echo "TEST_MODE=true"     >> .dev.vars
      - name: API tests
        run: npm run api:tests:dev
      - name: Deploy worker
        run: npm run worker:deploy