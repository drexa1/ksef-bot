name: Deploy Cloudflare worker

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Create Bruno config
        run: |
          cat > .dev.vars <<EOF
          ENVIRONMENT=${ENVIRONMENT}
          API_KEY=${API_KEY}
          TEST_MODE=true
          EOF

      - name: Verify local D1
        run: |
          npx wrangler d1 execute ksef-bot \
            --config wrangler.worker.toml \
            --local \
            --command='SELECT email, tier, firstName FROM users WHERE tier = 0'

      - name: Run tests
        run: npm run api:tests:dev
      - name: Deploy worker
        run: npm run worker:deploy