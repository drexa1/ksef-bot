name: Deploy Cloudflare worker

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Create Bruno config
        run: |
          cat > .dev.vars <<EOF
          ENVIRONMENT=${ENVIRONMENT}
          API_KEY=${API_KEY}
          TEST_MODE=true
          EOF

      - name: Start worker
        run: |
          npm run worker:dev > worker.log 2>&1 &
          npx wait-on http://localhost:3001
      - name: Call users endpoint
        run: |
          curl -v \
            -H "X-API-Key: ${API_KEY}" \
            http://localhost:3001/app/users
      - name: Worker log
        if: always()
        run: cat worker.log

      - name: Run tests
        run: npm run api:tests:dev
      - name: Deploy worker
        run: npm run worker:deploy