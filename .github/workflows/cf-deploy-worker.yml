name: Deploy Cloudflare worker

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Create CI config
        run: |
          cat > .dev.vars <<EOF
          ENVIRONMENT=${ENVIRONMENT}
          API_KEY=${API_KEY}
          TEST_MODE=true
          EOF

      - name: Start worker
        run: |
          npm run worker:dev > worker.log 2>&1 &
          echo $! > worker.pid
          sleep 5
          cat worker.log
      - name: Run API tests
        run: npm run api:tests:bruno
      - name: Worker logs
        if: always()
        run: cat worker.log

      - name: Deploy worker
        run: npm run worker:deploy