[package]
name = "ksef-bot"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ksef-bot"
path = "cli/main.rs"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dotenvy = "0.15"
inquire = { version = "0.9.4", features = ["date"] }
obfstr = "0.4.6"
reqwest = { version = "0.13.4", features = ["json", "query"] }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
serde_json = "1.0.151"
