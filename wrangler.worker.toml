name = "ksef-bot"
main = "worker/worker.ts"
compatibility_date = "2026-01-01"

[vars]
ENVIRONMENT = "cloudflare"
KSEF_URL = "https://api.ksef.mf.gov.pl/v2"
KSEF_INVOICE_SCHEMA = "https://assets.local/assets/schemas/KSeFInvoice.avsc"
KSEF_MIN_TIMEOUT = 100
KSEF_MAX_TIMEOUT = 3000
# ...Rest of required env coming from Cloudflare secrets

[observability.logs]
enabled = true
invocation_logs = true
[observability.traces]
enabled = true

# Deploy some of the static assets for the /docs
[assets]
binding = "assets"
directory = "./dist"

[[d1_databases]]
binding = "D1"
database_name = "ksef-bot"
database_id = "101428e1-3e1c-479b-a71b-374c1ee24412"
remote = true