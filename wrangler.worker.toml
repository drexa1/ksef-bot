name = "ksef-bot"
main = "worker/worker.ts"
compatibility_date = "2026-01-01"

[vars]
ENVIRONMENT = "cloudflare"
# KSeF (National e-Invoicing System)
KSEF_URL = "https://api.ksef.mf.gov.pl/v2"
KSEF_INVOICE_SCHEMA = "https://assets.local/schemas/KSeFInvoice.avsc"
KSEF_MIN_TIMEOUT = 100
KSEF_MAX_TIMEOUT = 3000
# CEIDG (Central Register on Business Activity)
CEIDG_URL = "https://dane.biznes.gov.pl/api/ceidg/v3"
# KRS (National Court Registry)
KRS_SEARCH_URL = "https://wyszukiwarka-krs-api.ms.gov.pl"
KRS_API_URL = "https://api-krs.ms.gov.pl"
# VAT Whitelist
VAT_WL_URL = "https://wl-api.mf.gov.pl/api/search/nip"
# Taxes
DEFAULT_VAT_PERCENTAGE = 23
DEFAULT_TAX_RATE = 12
DEFAULT_HEALTH_INSURANCE_BASE = 5537.18
DEFAULT_HEALTH_INSURANCE_RATE = 9
# ...Rest of required env coming from Cloudflare secrets

[observability.logs]
enabled = true
invocation_logs = true
[observability.traces]
enabled = true

# Deploy some of the static assets for the /docs
[assets]
binding = "assets"
directory = "./dist"

[[d1_databases]]
binding = "D1"
database_name = "ksef-bot"
database_id = "101428e1-3e1c-479b-a71b-374c1ee24412"
remote = true